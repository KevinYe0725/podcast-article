<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>podcast-article · 链接 → 深度文章</title>
<style>
  @font-face { font-family: "Inter"; src: url("/static/fonts/inter-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("/static/fonts/inter-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("/static/fonts/inter-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("/static/fonts/inter-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }

  :root {
    --bg: #ffffff; --bg2: #f7f7f8; --text: #0d0d0d; --dim: #8f8f8f;
    --border: #ececf1; --border2: #d9d9e0; --black: #0d0d0d;
    --green: #10a37f; --red: #ef4146;
    --font: "Inter", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px 100px; }

  /* 细滚动条（桌面） */
  #console::-webkit-scrollbar, #transcript::-webkit-scrollbar { width: 8px; }
  #console::-webkit-scrollbar-thumb, #transcript::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  #console::-webkit-scrollbar-track, #transcript::-webkit-scrollbar-track { background: transparent; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; padding: 16px 0; margin-bottom: 56px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
    background: rgba(255,255,255,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .wordmark { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .wordmark span { color: var(--dim); font-weight: 400; }
  .topbar .meta { font-size: 12px; color: var(--dim); }

  /* Hero */
  .hero { margin-top: 26px; }
  .hero h1 { font-size: clamp(34px, 5vw, 48px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.12; margin-bottom: 14px; }
  .hero p { font-size: 16px; color: var(--dim); margin-bottom: 36px; max-width: 640px; }

  /* Composer */
  .composer { border: 1px solid var(--border2); border-radius: 20px; padding: 8px 8px 10px; transition: box-shadow .15s, border-color .15s; }
  .composer:focus-within { border-color: var(--text); box-shadow: 0 1px 12px rgba(0,0,0,.06); }
  .composer .row { display: flex; align-items: center; gap: 10px; }
  .composer input[type=text] {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15.5px; font-family: var(--font); padding: 12px 12px; color: var(--text);
  }
  .composer input::placeholder { color: #b4b4bc; }
  .composer .opts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 2px 12px 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; font-size: 12.5px; color: var(--dim); cursor: pointer; user-select: none; background: #fff;
  }
  .chip:hover { border-color: var(--border2); color: var(--text); }
  .chip input[type=checkbox] { accent-color: var(--black); margin: 0; }
  .chip select, .chip input[type=text] {
    border: none; background: transparent; font-family: var(--font); font-size: 12.5px;
    color: var(--text); outline: none; padding: 0;
  }
  #go {
    background: var(--black); color: #fff; border: none; border-radius: 999px;
    padding: 11px 24px; font-size: 14px; font-weight: 600; font-family: var(--font);
    cursor: pointer; transition: background .15s, transform .1s;
  }
  #go:hover { background: #2c2c2c; }
  #go:disabled { background: #b4b4bc; cursor: not-allowed; }
  .hint { margin-top: 12px; font-size: 12.5px; color: #b4b4bc; }

  /* 运行视图 */
  #runview { display: none; margin-top: 40px; }
  #runview.show { display: block; }
  .stage { display: flex; align-items: flex-start; gap: 14px; position: relative; padding: 10px 0; }
  .stage::before {
    content: ""; position: absolute; left: 13px; top: 42px; bottom: -10px; width: 1.5px; background: var(--border);
  }
  .stage:last-child::before { display: none; }
  .stage .ico {
    width: 27px; height: 27px; border-radius: 50%; border: 1.5px solid var(--border2); background: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: #b4b4bc; flex-shrink: 0;
    transition: all .25s; z-index: 1;
  }
  .stage.active .ico { border-color: var(--green); color: var(--green); animation: spin 1.6s linear infinite; border-top-color: transparent; }
  .stage.done .ico { background: var(--green); border-color: var(--green); color: #fff; animation: none; }
  .stage .body { flex: 1; padding-top: 2px; }
  .stage .line1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .stage .name { font-size: 14px; font-weight: 500; color: #b4b4bc; }
  .stage.active .name, .stage.done .name { color: var(--text); }
  .stage .detail { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stage .bar { height: 3px; background: var(--bg2); border-radius: 99px; margin-top: 9px; overflow: hidden; display: none; }
  .stage.active .bar, .stage.done .bar { display: block; }
  .stage .bar i {
    display: block; height: 100%; background: var(--green); border-radius: 99px;
    width: 0%; transition: width .3s ease;
  }
  .stage .bar.indet i { width: 30% !important; animation: slide 1.1s ease-in-out infinite alternate; background: linear-gradient(90deg, var(--green), #7bd3b5); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
  .errline { color: var(--red); font-size: 13.5px; margin: 10px 0 0 41px; }

  #logdetails { margin: 14px 0 0 41px; }
  #logdetails summary { font-size: 12.5px; color: var(--dim); cursor: pointer; }
  #console {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-top: 10px; height: 200px; overflow-y: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.75; display: none;
  }
  #console.show { display: block; }
  #console .ln { color: #6e6e80; white-space: pre-wrap; word-break: break-all; }
  #console .ln.err { color: var(--red); }
  #console .ln.ok { color: var(--green); }

  /* 结果 */
  #result { display: none; margin-top: 48px; }
  #result.show { display: block; }
  /* 宽屏：文字稿打开时进入分栏阅读模式 */
  @media (min-width: 1080px) {
    body { font-size: 15px; }
    #result.withTranscript {
      display: grid; grid-template-columns: minmax(0, 1fr) 380px; column-gap: 44px;
      grid-template-areas: "meta side" "btns side" "art side"; align-items: start; align-content: start;
    }
    #result.withTranscript .rmeta { grid-area: meta; }
    #result.withTranscript .btnrow { grid-area: btns; }
    #result.withTranscript #article { grid-area: art; }
    #result.withTranscript #transcript {
      grid-area: side; display: block; position: sticky; top: 84px;
      max-height: calc(100vh - 120px); margin-top: 0;
    }
  }
  .rmeta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; font-size: 13px; color: var(--dim); }
  .rmeta .pod { font-weight: 600; color: var(--text); }
  .btnrow { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border2); background: #fff; color: var(--text); border-radius: 999px;
    padding: 8px 18px; font-size: 13px; font-weight: 500; font-family: var(--font); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; transition: all .15s; text-decoration: none;
  }
  .btn:hover { border-color: var(--black); }
  .btn.primary { background: var(--black); color: #fff; border-color: var(--black); }
  .btn.primary:hover { background: #2c2c2c; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, #go:focus-visible, #url:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .btn .k { color: var(--dim); font-size: 11px; }
  #article { font-size: 15px; line-height: 1.85; }
  @media (min-width: 1080px) { #result:not(.withTranscript) #article { max-width: 800px; } }
  #article h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; margin: 8px 0 18px; }
  #article h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 36px 0 12px; }
  #article h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
  #article p { margin: 10px 0; color: #3d3d44; }
  #article blockquote {
    border-left: 2.5px solid var(--text); padding: 4px 0 4px 18px; margin: 16px 0;
    color: var(--text); font-size: 15px;
  }
  #article ul, #article ol { padding-left: 22px; margin: 10px 0; }
  #article li { margin: 6px 0; color: #3d3d44; }
  #article table { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 13.5px; }
  #article th, #article td { border: 1px solid var(--border); padding: 9px 13px; text-align: left; }
  #article th { background: var(--bg2); font-weight: 600; }
  #article strong { font-weight: 600; }
  #article code { font-family: var(--mono); font-size: 13px; background: var(--bg2); padding: 1px 5px; border-radius: 5px; }
  #article hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  #transcript {
    display: none; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 22px; margin-top: 18px; font-family: var(--mono); font-size: 12px; line-height: 1.9;
    color: #6e6e80; max-height: 420px; overflow-y: auto; white-space: pre-wrap;
  }
  #transcript.show { display: block; }

  /* 库 */
  #lib { margin-top: 72px; }
  #lib h2 { font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px; }
  #lib .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .ep {
    border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; cursor: pointer;
    transition: border .15s, box-shadow .15s; background: #fff;
  }
  .ep:hover { border-color: var(--border2); box-shadow: 0 2px 14px rgba(0,0,0,.05); }
  .ep .t { font-size: 13.5px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ep .s { font-size: 12px; color: var(--dim); margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  .ep .s .ok { color: var(--green); font-weight: 500; }
  #empty-lib { color: #b4b4bc; font-size: 13px; }

  /* Toast */
  #toast {
    position: fixed; right: 22px; bottom: 22px; background: var(--black); color: #fff;
    border-radius: 12px; padding: 12px 18px; font-size: 13px; display: none; max-width: 420px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 10; line-height: 1.5;
  }
  #toast.show { display: block; }
  #toast a { color: #7bd3b5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="wordmark">podcast<span>-article</span></div>
    <div class="meta">本地转写 · DeepSeek 精读 · MCP</div>
  </div>

  <div class="hero">
    <h1>把播客，变成值得收藏的文章。</h1>
    <p>粘贴一条链接，本地语音转写 + AI 精读，几分钟产出带时间戳的深度文章。支持小宇宙 / YouTube / Bilibili / Apple Podcasts / RSS。</p>
  </div>

  <div class="composer">
    <div class="row">
      <input id="url" type="text" placeholder="粘贴播客或视频链接…" spellcheck="false" autocomplete="off">
      <button id="go" onclick="startRun()">生成文章</button>
    </div>
    <div class="opts">
      <label class="chip">转写语言
        <select id="lang"><option value="auto">自动</option><option value="zh">中文</option><option value="en">English</option></select>
      </label>
      <label class="chip">模型 <input type="text" id="model" size="6" placeholder="自动"></label>
      <label class="chip"><input type="checkbox" id="no_subs"> 强制转写</label>
      <label class="chip"><input type="checkbox" id="ft"> 重转写</label>
      <label class="chip"><input type="checkbox" id="fa"> 重写文章</label>
    </div>
  </div>
  <div class="hint">⌘/Ctrl + Enter 直接开始 · 产物会缓存，重新生成文章不必重新转写</div>

  <div id="runview">
    <div class="stage" id="st0"><div class="ico">1</div><div class="body"><div class="line1"><span class="name">抓取元信息</span><span class="detail"></span></div><div class="bar"><i></i></div></div></div>
    <div class="stage" id="st1"><div class="ico">2</div><div class="body"><div class="line1"><span class="name">下载音频</span><span class="detail"></span></div><div class="bar"><i></i></div></div></div>
    <div class="stage" id="st2"><div class="ico">3</div><div class="body"><div class="line1"><span class="name">获取文字稿</span><span class="detail"></span></div><div class="bar"><i></i></div></div></div>
    <div class="stage" id="st3"><div class="ico">4</div><div class="body"><div class="line1"><span class="name">撰写文章</span><span class="detail"></span></div><div class="bar indet"><i></i></div></div></div>
    <div id="errline" class="errline" style="display:none"></div>
    <details id="logdetails"><summary>详细日志</summary><div id="console"></div></details>
  </div>

  <div id="result">
    <div class="rmeta" id="rmeta"></div>
    <div class="btnrow">
      <button class="btn primary" id="nbtn" onclick="pushNotion()">✦ 写入 Notion</button>
      <button class="btn" id="tbtn" onclick="toggleTranscript()">查看文字稿</button>
      <button class="btn" onclick="regenArticle()">重新生成文章</button>
    </div>
    <article id="article"></article>
    <div id="transcript"></div>
  </div>

  <div id="lib">
    <h2>历史文章</h2>
    <div class="grid" id="libgrid"></div>
    <div id="empty-lib">还没有生成过任何文章。</div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let es = null, pollTimer = null, jobId = null, curWorkdir = null, curUrl = null, shownLogs = 0;
const STAGE_PREFIX = ["[meta]", "[audio]", "[text]", "[write]"];

const esc = (s) => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const mb = (b) => (b / 1048576).toFixed(1);
const mmss = (s) => { s = Math.round(s); const m = Math.floor(s / 60); return m ? `${m}分${String(s % 60).padStart(2, "0")}秒` : `${s}秒`; };
const humanDur = (sec) => { if (!sec) return ""; const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return h ? `${h}小时${m}分` : `${m}分钟`; };
let toastTimer = null;
function toast(html) {
  $("toast").innerHTML = html; $("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("show"), 6000);
}

async function startRun(opts = {}) {
  const url = opts.url !== undefined ? opts.url : $("url").value.trim();
  if (!url) { $("url").focus(); return; }
  const resp = await fetch("/api/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      url, lang: $("lang").value, model: $("model").value.trim(),
      no_subs: $("no_subs").checked,
      force_transcript: opts.force_transcript ?? $("ft").checked,
      force_article: opts.force_article ?? $("fa").checked,
    }),
  });
  const data = await resp.json();
  if (!resp.ok) { toast("⚠ " + esc(data.error || "启动失败")); return; }
  curUrl = url;
  beginJob(data.job_id);
}

function beginJob(id) {
  jobId = id; shownLogs = 0; curWorkdir = null;
  $("console").textContent = ""; $("logdetails").open = false;
  $("runview").classList.add("show");
  $("result").classList.remove("show");
  $("errline").style.display = "none";
  setStage(-1, null);
  $("go").disabled = true; $("go").textContent = "生成中…";
  shownLogs = 0; $("console").innerHTML = "";
  connectSSE(id);
  $("runview").scrollIntoView({ behavior: "smooth", block: "start" });
}

function setStage(active, progress) {
  for (let i = 0; i < 4; i++) {
    const el = $("st" + i);
    const isActive = i === active && active < 4;
    const isDone = active === 4 || i < active;
    el.classList.toggle("active", isActive);
    el.classList.toggle("done", isDone);
    el.querySelector(".ico").textContent = isDone ? "✓" : i + 1;
    const bar = el.querySelector(".bar"), fill = el.querySelector(".bar i");
    const detail = el.querySelector(".detail");
    bar.classList.remove("indet");
    if (isDone) { fill.style.width = "100%"; detail.textContent = "完成"; bar.classList.remove("indet"); }
    else if (isActive && progress && progress.stage === ["", "download", "asr", "llm"][i]) {
      detail.textContent = detailText(progress);
      if (progress.pct !== undefined && progress.pct !== null) { fill.style.width = progress.pct + "%"; }
      else { bar.classList.add("indet"); fill.style.width = "30%"; }
    } else if (isActive) {
      detail.textContent = ""; fill.style.width = progress && progress.pct != null ? progress.pct + "%" : "0%";
    } else { detail.textContent = ""; fill.style.width = "0%"; }
  }
}

function detailText(p) {
  if (p.stage === "download" && p.total) return `${mb(p.downloaded)} / ${mb(p.total)} MB · ${p.pct}%`;
  if (p.stage === "asr") {
    let s = p.pct != null ? `${p.pct}%` : "";
    if (p.eta_s != null) s += ` · 剩余 ${mmss(p.eta_s)}`;
    return s;
  }
  if (p.stage === "llm") {
    if (p.chunk) return `第 ${p.chunk}/${p.total} 段` + (p.chars ? ` · 已生成 ${p.chars.toLocaleString()} 字` : "");
    return p.chars ? `已生成 ${p.chars.toLocaleString()} 字` : "";
  }
  return "";
}

function stageIndexFromLogs(logs) {
  const seen = STAGE_PREFIX.map((p) => logs.some((l) => l.startsWith(p)));
  if (logs.some((l) => l.startsWith("[done]"))) return 4;
  return seen.lastIndexOf(true);
}

function appendLog(line) {
  const div = document.createElement("div");
  div.className = "ln" + (line.startsWith("[error]") ? " err" : line.startsWith("[done]") ? " ok" : "");
  div.innerHTML = esc(line);
  $("console").appendChild(div);
  $("console").scrollTop = $("console").scrollHeight;
}

function connectSSE(id) {
  if (es) es.close();
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  es = new EventSource("/api/stream/" + id);
  es.addEventListener("log", (e) => appendLog(JSON.parse(e.data).line));
  es.addEventListener("progress", (e) => {
    const p = JSON.parse(e.data);
    const order = { download: 1, asr: 2, llm: 3 };
    const fromLogs = stageIndexFromLogs([...$("console").children].map((c) => c.textContent));
    const stageIdx = Math.max(order[p.stage] ?? 0, Math.min(fromLogs, 2));
    setStage(stageIdx, p);
  });
  es.addEventListener("status", (e) => {
    const d = JSON.parse(e.data);
    es.close(); es = null;
    finishJob(d);
  });
  es.onerror = () => {
    // SSE 失败时回退到轮询
    if (es) { es.close(); es = null; }
    if (!pollTimer && jobId) pollTimer = setInterval(pollJob, 800);
  };
}

async function pollJob() {
  if (!jobId) return;
  const resp = await fetch("/api/job/" + jobId);
  if (!resp.ok) return;
  const job = await resp.json();
  (job.logs || []).slice(shownLogs).forEach((l) => { appendLog(l); shownLogs++; });
  if (job.progress) {
    const order = { download: 1, asr: 2, llm: 3 };
    const fromLogs = stageIndexFromLogs(job.logs || []);
    setStage(Math.max(order[job.progress.stage] ?? 0, Math.min(fromLogs, 2)), job.progress);
  }
  if (job.status !== "running") {
    clearInterval(pollTimer); pollTimer = null;
    finishJob({ status: job.status, error: job.error, workdir: job.workdir, meta: job.meta, article_html: job.article_html });
  }
}

function finishJob(d) {
  $("go").disabled = false; $("go").textContent = "生成文章";
  if (d.status === "done") {
    setStage(4, null);
    curWorkdir = d.workdir;
    const m = d.meta || {};
    $("rmeta").innerHTML =
      `<span class="pod">${esc(m.podcast || "")}</span><span>${esc(m.title || "")}</span>` +
      (m.duration ? `<span>${humanDur(m.duration)}</span>` : "");
    $("article").innerHTML = d.article_html || "";
    $("transcript").textContent = ""; $("transcript").dataset.loaded = "";
    $("transcript").classList.remove("show"); $("result").classList.remove("withTranscript");
    $("tbtn").textContent = "查看文字稿";
    $("nbtn").disabled = false;
    $("result").classList.add("show");
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    loadLibrary();
  } else {
    setStage(-1, null);
    $("errline").textContent = "✕ " + (d.error || "任务失败");
    $("errline").style.display = "block";
  }
}

async function toggleTranscript() {
  const el = $("transcript");
  if (el.classList.contains("show")) {
    el.classList.remove("show"); $("result").classList.remove("withTranscript");
    $("tbtn").textContent = "查看文字稿"; return;
  }
  if (!el.dataset.loaded && curWorkdir) {
    const resp = await fetch(`/api/file/${encodeURIComponent(curWorkdir)}/transcript.txt`);
    el.textContent = await resp.text();
    el.dataset.loaded = "1";
  }
  el.classList.add("show"); $("result").classList.add("withTranscript");
  $("tbtn").textContent = "收起文字稿";
}

function regenArticle() {
  if (!curUrl) { toast("⚠ 请从输入框重新提交链接"); return; }
  startRun({ url: curUrl, force_article: true });
}

async function pushNotion() {
  if (!curWorkdir) return;
  const btn = $("nbtn");
  btn.disabled = true; btn.textContent = "写入中…";
  try {
    const resp = await fetch("/api/notion", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dir: curWorkdir }),
    });
    const data = await resp.json();
    if (resp.ok) toast(`✦ 已写入 Notion · <a href="${esc(data.url)}" target="_blank">打开页面</a>`);
    else toast("⚠ " + esc(data.error || "写入失败"));
  } catch (e) { toast("⚠ " + esc(String(e))); }
  btn.disabled = false; btn.textContent = "✦ 写入 Notion";
}

async function loadLibrary() {
  const resp = await fetch("/api/library");
  const { items } = await resp.json();
  $("empty-lib").style.display = items.length ? "none" : "block";
  $("libgrid").innerHTML = items.map((it) => `
    <div class="ep" onclick="openEpisode('${encodeURIComponent(it.dir)}')">
      <div class="t">${esc(it.title)}</div>
      <div class="s">
        ${it.podcast ? `<span>${esc(it.podcast)}</span>` : ""}
        ${it.has_article ? `<span class="ok">✓ 有文章</span>` : `<span>无文章</span>`}
      </div>
    </div>`).join("");
}

async function openEpisode(dirEnc) {
  const dir = decodeURIComponent(dirEnc);
  const metaResp = await fetch(`/api/file/${dirEnc}/meta.json`);
  const meta = await metaResp.json();
  curWorkdir = dir; curUrl = meta.url || null;
  const artResp = await fetch(`/api/file/${dirEnc}/article.md`);
  if (!artResp.ok) {
    $("rmeta").innerHTML = `<span class="pod">${esc(meta.podcast || "")}</span><span>${esc(meta.title || "")}</span>`;
    $("article").innerHTML = `<p style="color:var(--dim)">该单集还没有生成文章。</p>`;
    const tResp = await fetch(`/api/file/${dirEnc}/transcript.txt`);
    $("transcript").textContent = await tResp.text(); $("transcript").dataset.loaded = "1";
    $("transcript").classList.add("show"); $("result").classList.add("withTranscript");
    $("tbtn").textContent = "收起文字稿";
    $("nbtn").disabled = true;
  } else {
    const { html } = await artResp.json();
    $("rmeta").innerHTML =
      `<span class="pod">${esc(meta.podcast || "")}</span><span>${esc(meta.title || "")}</span>` +
      (meta.duration ? `<span>${humanDur(meta.duration)}</span>` : "");
    $("article").innerHTML = html;
    $("transcript").textContent = ""; $("transcript").dataset.loaded = "";
    $("transcript").classList.remove("show"); $("result").classList.remove("withTranscript");
    $("tbtn").textContent = "查看文字稿";
    $("nbtn").disabled = false;
  }
  $("result").classList.add("show");
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("url").addEventListener("keydown", (e) => {
  if (e.key === "Enter") startRun();
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !$("go").disabled) { e.preventDefault(); startRun(); }
});
loadLibrary();
</script>
</body>
</html>
