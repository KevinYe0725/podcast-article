name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    env:
      # Tests mock network calls; this only satisfies client construction.
      DEEPSEEK_API_KEY: sk-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/ -q

  ui:
    name: 界面测试（jsdom）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - name: 跑 UI 测试（自带临时数据与隔离目录）
        run: bash tests/ui/run.sh
