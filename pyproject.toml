[project]
name = "podcast-article"
version = "0.1.0"
description = "把播客/视频链接变成一篇有价值的深度文章：抓取 → 转写 → DeepSeek 精读提炼"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.10.0",
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "oss2>=2.18.6",
    "rich>=13.7.0",
    "openai>=1.40.0",
    # Apple Silicon 上是默认转写后端；其他平台退回 faster-whisper（见 [faster] extra）
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "flask>=3.1.3",
    "markdown>=3.10.3",
    "mcp<2",
    # 知识库：jieba 给 FTS5 做中文分词（SQLite 自带的分词器不切中文），
    # numpy 做向量检索（个人级书库直接暴力算余弦就够，不需要向量数据库）
    "jieba>=0.42.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
faster = ["faster-whisper>=1.0.0"]
# 语义检索用的嵌入模型（ONNX 运行时，**不需要 torch**；模型约 100MB，首次用时下载）。
# 不装也能用：知识库会退回纯词法检索（FTS5/BM25），功能不残缺，只是不懂近义改写。
kb = ["fastembed>=0.4.0"]

[project.scripts]
podcast-article = "podcast_article.cli:main"
podcast-article-mcp = "podcast_article.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]
